name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf update -y
          dnf install -y python3 python3-pip mpv mpv-libs gcc python3-devel libX11-devel
          pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install build wheel
          pip install .

      - name: Build package
        run: |
          python3 -m build
